name: Iprint
description: >-
  iPrint.com was an early online print shop, launched in 1996 out of Larkspur,
  California, that let consumers and small businesses design and order
  customizable printed products (business cards, stationery, invitations,
  promotional items) over the web. Backed by Canaan Partners, the company went
  public on the NASDAQ under the symbol IPRT in March 2000, merged with
  promotional-products firm Wood Associates in 2001, was delisted in 2002, and
  its assets were ultimately acquired by Harland Clarke in 2009. The iprint.com
  domain today hosts a live consumer print e-commerce storefront operated out of
  Richmond Hill, Ontario, offering business cards, marketing materials, signs,
  banners, stickers, and design services. The company exposes no public
  developer program, API, SDK, or documentation surface; this profile is
  identity-only and carries no API artifacts.
